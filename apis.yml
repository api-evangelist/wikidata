- aid: wikidata:sparql-query-service
  name: SPARQL Query Service
  description: >-
    The Wikidata Query Service provides a SPARQL 1.1 endpoint at query.wikidata.org for running complex
    graph queries over the full Wikidata knowledge base. Supports federated queries, GeoSPARQL, and time-aware
    queries. Data is CC0 licensed.
  humanURL: https://www.wikidata.org/wiki/Wikidata:SPARQL_query_service
  baseURL: https://query.wikidata.org/sparql
